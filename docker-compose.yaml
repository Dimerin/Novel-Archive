version: '3.8'
services:
  php_apache:
    container_name: php_8.2_apache_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./src:/var/www/html"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.1.0
    container_name: mysql_8.1.0_container
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: novel_archive
    ports:
      - "3306:3306"
    volumes:
      - "./dump:/var/lib/mysql"
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql"
    
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: phpmyadmin_container
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    
